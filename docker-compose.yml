services:
  featureflags:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3500}:${PORT:-3500}"
    environment:
      PORT: ${PORT:-3500}
      FF_DB: /data/featureflags.db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente ou no arquivo .env}
      EVALUATION_SECRET: ${EVALUATION_SECRET:?Defina EVALUATION_SECRET no ambiente ou no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - dados:/data
    restart: unless-stopped

volumes:
  dados:
